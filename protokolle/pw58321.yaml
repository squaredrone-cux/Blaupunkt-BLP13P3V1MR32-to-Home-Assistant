        scan_interval: 30

      - name: WP Niederdruck Umrechnungstemperatur
        unique_id: wp_niederdruck_umrechnungstemperatur
        slave: 1
        address: 32808          # 0x8028 (Skalierung unbekannt)
        input_type: holding
        data_type: int16
