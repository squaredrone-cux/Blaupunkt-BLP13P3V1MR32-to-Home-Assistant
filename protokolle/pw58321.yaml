# ============================================================================
# Wärmepumpe mit Modbus-Protokoll PW58321 ("Easylife", ohne Kaskade) – ERSETZT
# packages/waermepumpe_modbus.yaml. Nur eine der beiden Dateien verwenden!
# ============================================================================
# Die Registerliste von PW58321 ist laut PDF identisch mit PW58322; einziger
# Unterschied: feste Slave-Adresse 1 (keine DIP-Schalter, keine Kaskade).
# Bus: RS485, 9600 Baud, 8N1. Gateway "Modbus TCP to RTU", Port 502.
# Hinweise zu Skalierung, P08 und Flash: siehe docs/modbus-register.md.
# ============================================================================

modbus:
  - name: waermepumpe
    type: tcp                   # Gateway-Protokoll "Modbus TCP to RTU"
    host: !secret wp_modbus_host      # IP des Waveshare-Gateways an der Wärmepumpe
    port: 502                   # Port des Gateways anpassen (z.B. 4196)
    delay: 2
    timeout: 5
    message_wait_milliseconds: 250

    sensors:
      # ---------------- Temperaturen ----------------
      - name: WP Rücklauf Temperatur
        unique_id: wp_ruecklauf_temperatur
        slave: 1
        address: 32782          # 0x800E
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: WP Vorlauf Temperatur
        unique_id: wp_vorlauf_temperatur
        slave: 1
        address: 32786          # 0x8012
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: WP Warmwasser Temperatur
        unique_id: wp_warmwasser_temperatur
        slave: 1
        address: 32783          # 0x800F
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: WP Außentemperatur
        unique_id: wp_aussentemperatur
        slave: 1
        address: 32785          # 0x8011
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 30

      - name: WP Sauggas Temperatur
        unique_id: wp_sauggas_temperatur
        slave: 1
        address: 32789          # 0x8015
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 60

      - name: WP Verdampfer Temperatur
        unique_id: wp_verdampfer_temperatur
        slave: 1
        address: 32790          # 0x8016 externe Spule
        input_type: holding
        data_type: int16
        scale: 0.5
        precision: 1
