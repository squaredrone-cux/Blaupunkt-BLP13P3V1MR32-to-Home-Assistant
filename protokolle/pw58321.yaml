  # ==========================================================================
  # Wellpro-ADAM-Modul (DS18B20-Eingänge) / Fühler am Pufferspeicher
  # Zweites Waveshare-Gateway (optional). Gateway-Protokoll wie beim
  # ersten Gateway: "Modbus TCP to RTU" -> type: tcp. Falls dort "transparent"
  # eingestellt ist, stattdessen type: rtuovertcp verwenden.
  #
  # Holding-Register 0x00-0x07 = Kanal 1-8 (Data1-Data8), Standard-Slave 1.
  # Rohwert 65535 (0xFFFF) = Fühler nicht angeschlossen.
  # Rohwert > 10000 = negative Temperatur: -(Rohwert-10000)/10 °C
  # sonst Rohwert / 10 = °C  (Umrechnung in den Template-Sensoren unten)
  # ==========================================================================
  - name: puffer
    type: tcp
    host: !secret puffer_modbus_host  # IP des Gateways am Puffer
    port: 502                   # Port des Gateways anpassen (z.B. 4196)
    delay: 2
    timeout: 5
    message_wait_milliseconds: 250

    sensors:
      - name: Puffer Roh 1
        unique_id: puffer_roh_1
        slave: 1
        address: 0              # Data1
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Puffer Roh 2
        unique_id: puffer_roh_2
        slave: 1
        address: 1              # Data2
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Puffer Roh 3
        unique_id: puffer_roh_3
        slave: 1
        address: 2              # Data3
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: Puffer Roh 4
        unique_id: puffer_roh_4
        slave: 1
        address: 3              # Data4
        input_type: holding
        data_type: uint16
        scan_interval: 30

template:
  # ---------------- Pufferspeicher-Fühler in °C umrechnen ----------------
  # Kanäle: 1 = Puffer WP Vorlauf, 2 = Puffer WP Rücklauf,
  #         3 = Puffer Heizkreis Rücklauf, 4 = Puffer Heizkreis Vorlauf
  - sensor:
      - name: Puffer WP Vorlauf
        unique_id: puffer_wp_vorlauf
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ (states('sensor.puffer_roh_1') | int(65535)) != 65535 }}"
        state: >
          {% set r = states('sensor.puffer_roh_1') | int(0) %}
          {{ ((-(r - 10000) if r > 10000 else r) / 10) | round(1) }}

      - name: Puffer WP Rücklauf
        unique_id: puffer_wp_rucklauf
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ (states('sensor.puffer_roh_2') | int(65535)) != 65535 }}"
        state: >
          {% set r = states('sensor.puffer_roh_2') | int(0) %}
          {{ ((-(r - 10000) if r > 10000 else r) / 10) | round(1) }}

      - name: Puffer Heizkreis Rücklauf
        unique_id: puffer_heizkreis_rucklauf
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ (states('sensor.puffer_roh_3') | int(65535)) != 65535 }}"
        state: >
          {% set r = states('sensor.puffer_roh_3') | int(0) %}
          {{ ((-(r - 10000) if r > 10000 else r) / 10) | round(1) }}

      - name: Puffer Heizkreis Vorlauf
        unique_id: puffer_heizkreis_vorlauf
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: "{{ (states('sensor.puffer_roh_4') | int(65535)) != 65535 }}"
        state: >
          {% set r = states('sensor.puffer_roh_4') | int(0) %}
          {{ ((-(r - 10000) if r > 10000 else r) / 10) | round(1) }}

      # Spreizung der Wärmepumpe (Vorlauf minus Rücklauf)
      - name: WP Spreizung
        unique_id: wp_spreizung
        unit_of_measurement: "K"
        state_class: measurement
        availability: >
          {{ is_number(states('sensor.wp_vorlauf_temperatur')) and
             is_number(states('sensor.wp_rucklauf_temperatur')) }}
        state: >
          {{ (states('sensor.wp_vorlauf_temperatur') | float
              - states('sensor.wp_rucklauf_temperatur') | float) | round(1) }}

