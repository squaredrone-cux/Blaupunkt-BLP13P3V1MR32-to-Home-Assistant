        device_class: temperature
        state_class: measurement
        scan_interval: 60

      - name: WP Kühlspule Temperatur
        unique_id: wp_kuehlspule_temperatur
        slave: 1
        address: 32794          # 0x801A
        input_type: holding
        data_type: int16
