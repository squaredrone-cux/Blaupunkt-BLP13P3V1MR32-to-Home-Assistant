        state_class: measurement
        availability: >
          {{ is_number(states('sensor.puffer_heizkreis_vorlauf')) and
             is_number(states('sensor.puffer_heizkreis_rucklauf')) }}
        state: >
          {{ (states('sensor.puffer_heizkreis_vorlauf') | float
              - states('sensor.puffer_heizkreis_rucklauf') | float) | round(1) }}

  # ---------------- Binary Sensoren aus Flag-Bits ----------------
  - binary_sensor:
      # Status = Ausgangs-Bit ODER gemessener Istwert (Frequenz, Drehzahl > 0).
      # Fehlen die Quelldaten, zeigt der Sensor "nicht verfügbar" statt "aus".
      - name: WP Verdichter läuft
        unique_id: wp_verdichter_laeuft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) or is_number(states('sensor.wp_verdichter_frequenz')) }}"
        state: >
          {{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(1) > 0
             or (states('sensor.wp_verdichter_frequenz') | float(0)) > 0 }}

      - name: WP Lüfter läuft
        unique_id: wp_luefter_laeuft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) or is_number(states('sensor.wp_lufter_drehzahl')) }}"
        state: >
          {{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(32) > 0
             or (states('sensor.wp_lufter_drehzahl') | float(0)) > 0 }}

      - name: WP 4-Wege-Ventil
        unique_id: wp_4wege_ventil
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(64) > 0 }}"

      - name: WP Umwälzpumpe läuft
        unique_id: wp_umwaelzpumpe_laeuft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_3')) or is_number(states('sensor.wp_dc_pumpe_drehzahl')) }}"
        state: >
          {{ (states('sensor.wp_ausgange_3') | int(0)) | bitwise_and(1) > 0
             or (states('sensor.wp_dc_pumpe_drehzahl') | float(0)) > 0 }}

      - name: WP Abtauung aktiv
        unique_id: wp_abtauung_aktiv
        availability: "{{ is_number(states('sensor.wp_modus_freigaben')) }}"
        state: "{{ (states('sensor.wp_modus_freigaben') | int(0)) | bitwise_and(128) > 0 }}"

      - name: WP Warmwasser Heizstab
        unique_id: wp_ww_heizstab
        availability: "{{ is_number(states('sensor.wp_ausgange_2')) }}"
        state: "{{ (states('sensor.wp_ausgange_2') | int(0)) | bitwise_and(128) > 0 }}"

      - name: WP Störung
        unique_id: wp_stoerung
        device_class: problem
        state: >
          {% set regs = ['sensor.wp_fehler_1','sensor.wp_fehler_2','sensor.wp_fehler_3',
                         'sensor.wp_fehler_4','sensor.wp_fehler_5','sensor.wp_fehler_6',
                         'sensor.wp_fehler_7','sensor.wp_inverter_fehler_low',
                         'sensor.wp_inverter_fehler_high'] %}
          {{ regs | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}

  # ---------------- Schalter, Zahlen, Auswahl (schreiben) ----------------
  # Power: Bit0 in Register 0x0000. Es wird das gesamte Register geschrieben,
  # daher werden die übrigen Bits aus dem zuletzt gelesenen Wert übernommen.
  - switch:
      - name: WP Power
        unique_id: wp_power
        state: "{{ (states('sensor.wp_steuerflags_1') | int(0)) | bitwise_and(1) > 0 }}"
        availability: "{{ states('sensor.wp_steuerflags_1') not in ['unknown','unavailable'] }}"
        turn_on:
          - action: modbus.write_register
            data:
              hub: waermepumpe
              slave: 1
              address: 0
              value: "{{ (states('sensor.wp_steuerflags_1') | int(0)) | bitwise_or(1) }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_steuerflags_1
        turn_off:
          - action: modbus.write_register
            data:
              hub: waermepumpe
              slave: 1
              address: 0
              value: "{{ (states('sensor.wp_steuerflags_1') | int(0)) | bitwise_and(65534) }}"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.wp_steuerflags_1

