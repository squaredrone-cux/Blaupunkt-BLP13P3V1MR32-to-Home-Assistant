template:
  - sensor:
      - name: WP Spreizung
        unique_id: cg248075_wp_spreizung
        unit_of_measurement: "K"
        state_class: measurement
        availability: "{{ is_number(states('sensor.wp_vorlauf_temperatur')) and is_number(states('sensor.wp_rucklauf_temperatur')) }}"
        state: "{{ (states('sensor.wp_vorlauf_temperatur') | float - states('sensor.wp_rucklauf_temperatur') | float) | round(1) }}"


  - binary_sensor:
      - name: WP Verdichter läuft
        unique_id: cg248075_wp_verdichter_lauft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(1) > 0 }}"

      - name: WP Lüfter läuft
        unique_id: cg248075_wp_lufter_lauft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(32) > 0 }}"

      - name: WP 4-Wege-Ventil
        unique_id: cg248075_wp_4_wege_ventil
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(64) > 0 }}"

      - name: WP Heizstab Puffer
        unique_id: cg248075_wp_heizstab_puffer
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_2')) }}"
        state: "{{ (states('sensor.wp_ausgange_2') | int(0)) | bitwise_and(32) > 0 }}"

      - name: WP Warmwasser Heizstab
        unique_id: cg248075_wp_warmwasser_heizstab
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_2')) }}"
        state: "{{ (states('sensor.wp_ausgange_2') | int(0)) | bitwise_and(128) > 0 }}"

      - name: WP Umwälzpumpe läuft
        unique_id: cg248075_wp_umwalzpumpe_lauft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_3')) }}"
