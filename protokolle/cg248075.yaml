# ============================================================================
# Wärmepumpe mit Modbus-Protokoll CG248075 (V1.2) – ERSETZT
# packages/waermepumpe_modbus.yaml. Nur eine der beiden Dateien verwenden!
# ============================================================================
# UNGETESTET: aus dem Protokoll-PDF erzeugt, nicht an einer echten Anlage
# geprüft. Erst nur lesen, Werte mit dem Display vergleichen, dann schreiben.
#
# Bus: RS485, 19200 Baud, 8 Datenbits, KEINE Parität, 2 STOPBITS (8N2)!
#      -> im Gateway so einstellen, sonst kommen keine Antworten.
# Adresse 1–8 über DIP-Schalter 2–4. Gateway "Modbus TCP to RTU", Port 502.
# Alle Register: Holding (03H lesen, 06H schreiben), Lesewerte ab 0x0000.
# Jeder Schreibzugriff geht in den Flash der WP -> nie zyklisch schreiben.
#
# Besonderheiten dieses Protokolls:
#   - Vorlauf, Rücklauf und Warmwasser 0,1 °C pro Bit, Außen 0,5 °C
#   - Sollwerte (0x00CA–0x00CC, E13–E24) als °C × 2, nur das untere Byte zählt
#   - keine Heizkurve P22–P24: stattdessen 4-Punkte-Kurve E01–E04 / E13–E16
#     (gilt im Verdichtermodus ECO, Register 0x0190)
#   - DC-Pumpe F13: 0 = manuell, 1 = Automatik
#   - kein Silent/Powerful-Bit; stattdessen Verdichtermodus Normal/ECO/Nacht
#   -> Die Automationen "Heizkurve Stufe" und "ECO/Smart" aus dem Paket passen
#      hier NICHT und sollten deaktiviert bleiben.
# ============================================================================

modbus:
  - name: waermepumpe
    type: tcp                          # Gateway im Modus "Modbus TCP to RTU"
    host: !secret wp_modbus_host
    port: 502
    delay: 2
    timeout: 5
    message_wait_milliseconds: 250     # Protokoll: > 200 ms zwischen Anfragen
