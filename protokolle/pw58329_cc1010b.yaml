template:
  - sensor:
      - name: WP Spreizung
        unique_id: pw58329_wp_spreizung
        unit_of_measurement: "K"
        state_class: measurement
        availability: "{{ is_number(states('sensor.wp_vorlauf_temperatur')) and is_number(states('sensor.wp_rucklauf_temperatur')) }}"
        state: "{{ (states('sensor.wp_vorlauf_temperatur') | float - states('sensor.wp_rucklauf_temperatur') | float) | round(1) }}"


  - binary_sensor:
      - name: WP Verdichter läuft
        unique_id: pw58329_wp_verdichter_lauft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(1) > 0 }}"

      - name: WP Lüfter läuft
        unique_id: pw58329_wp_lufter_lauft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(32) > 0 }}"

      - name: WP 4-Wege-Ventil
        unique_id: pw58329_wp_4_wege_ventil
        availability: "{{ is_number(states('sensor.wp_ausgange_1')) }}"
        state: "{{ (states('sensor.wp_ausgange_1') | int(0)) | bitwise_and(64) > 0 }}"

      - name: WP Heizstab Puffer
        unique_id: pw58329_wp_heizstab_puffer
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_2')) }}"
        state: "{{ (states('sensor.wp_ausgange_2') | int(0)) | bitwise_and(32) > 0 }}"

      - name: WP Warmwasser Heizstab
        unique_id: pw58329_wp_warmwasser_heizstab
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_2')) }}"
        state: "{{ (states('sensor.wp_ausgange_2') | int(0)) | bitwise_and(128) > 0 }}"

      - name: WP Umwälzpumpe läuft
        unique_id: pw58329_wp_umwalzpumpe_lauft
        device_class: running
        availability: "{{ is_number(states('sensor.wp_ausgange_3')) }}"
        state: "{{ (states('sensor.wp_ausgange_3') | int(0)) | bitwise_and(1) > 0 }}"

      - name: WP Abtauung aktiv
        unique_id: pw58329_wp_abtauung_aktiv
        device_class: running
        availability: "{{ is_number(states('sensor.wp_modus_freigaben')) }}"
        state: "{{ (states('sensor.wp_modus_freigaben') | int(0)) | bitwise_and(128) > 0 }}"

      - name: WP Störung
        unique_id: pw58329_wp_stoerung
        device_class: problem
        state: >
          {% set regs = ['sensor.wp_fehler_1','sensor.wp_fehler_2','sensor.wp_fehler_3',
                         'sensor.wp_fehler_4','sensor.wp_fehler_5','sensor.wp_fehler_6',
                         'sensor.wp_fehler_7','sensor.wp_inverter_fehler_low',
                         'sensor.wp_inverter_fehler_high'] %}
          {{ regs | map('states') | map('int', 0) | select('gt', 0) | list | count > 0 }}

  - switch:
      - name: WP Power
        unique_id: pw58329_wp_power
        state: "{{ (states('sensor.wp_steuerflags_1') | int(0)) | bitwise_and(1) > 0 }}"
