# ============================================================================
# Wärmepumpe mit Modbus-Protokoll PW58329 (Steuerung CC1010B) – ERSETZT
# packages/waermepumpe_modbus.yaml. Nur eine der beiden Dateien verwenden!
# ============================================================================
# UNGETESTET: aus dem Protokoll-PDF erzeugt, nicht an einer echten Anlage
# geprüft. Erst nur lesen, Werte mit dem Display vergleichen, dann schreiben.
#
# Bus: RS485, 9600 Baud, 8N1. Adresse 1–8 über DIP-Schalter 2–4.
# Gateway: Waveshare o. ä. im Modus "Modbus TCP to RTU", Port 502.
# Alle Register: Holding (03H lesen, 06H schreiben). Lesewerte ab 0x0000
# (nicht 0x8000 wie bei PW58322), Steuerflags ab 0x003F.
# Jeder Schreibzugriff geht in den Flash der WP -> nie zyklisch schreiben.
#
# Unterschiede zu PW58322, die das Paket berücksichtigt:
#   - Heißgas 1 °C pro Bit, Rücklauf 0,1 °C, übrige Temperaturen 0,5 °C
#   - Sollwerte P03/P04/P05 bei 0x00BE–0x00C0, P08 bei 0x00E9
#   - DC-Pumpe ab 0x015F (Werte für den Modus im Protokoll nicht angegeben)
# Puffer-Fühler (Wellpro) bei Bedarf aus waermepumpe_modbus.yaml übernehmen.
# ============================================================================

modbus:
  - name: waermepumpe
    type: tcp                          # Gateway im Modus "Modbus TCP to RTU"
    host: !secret wp_modbus_host
    port: 502
    delay: 2
    timeout: 5
    message_wait_milliseconds: 250     # Protokoll: > 200 ms zwischen Anfragen
    sensors:
      - name: WP Modus Freigaben
        unique_id: pw58329_wp_modus_freigaben
        slave: 1
        address: 3            # 0x0003
        input_type: holding
        data_type: uint16
        scan_interval: 10

      - name: WP Ausgänge 1
