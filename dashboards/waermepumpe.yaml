- title: Energiebilanz
  path: statistik-energiebilanz
  icon: mdi:home-lightning-bolt
  subview: true
  back_path: /wp-neu/statistik
  type: sections
  max_columns: 2
  theme: Liquid Glass
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Dieser Monat
      icon: mdi:calendar-month
    - type: tile
      entity: sensor.haus_verbrauch_monat
      name: Haus gesamt
      color: brown
      icon: mdi:home-lightning-bolt
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.pv_ertrag_monat
      name: Solar-Ertrag
      color: yellow
      icon: mdi:solar-power
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.haus_verbrauch_minus_pv_monat
      name: Verbrauch − Solar
      color: grey
      icon: mdi:scale-balance
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.netzbezug_monat
      name: Netzbezug (gemessen)
      color: red
      icon: mdi:transmission-tower-import
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.wp_energie_monat
      name: Wärmepumpe
      color: orange
      icon: mdi:heat-pump
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.einspeisung_monat
      name: Einspeisung
      color: green
      icon: mdi:transmission-tower-export
      grid_options:
        columns: 4
    - type: markdown
      grid_options:
        columns: full
      content: '{% set h = states(''sensor.haus_verbrauch_monat'') | float(0) %}{% set w = states(''sensor.wp_energie_monat'') | float(0) %}{%
        set n = states(''sensor.netzbezug_monat'') | float(0) %}{% set p = states(''sensor.pv_ertrag_monat'') | float(0) %}{% set e = states(''sensor.einspeisung_monat'')
        | float(0) %}Wärmepumpe = **{{ (w / h * 100) | round(0) if h > 0 else 0 }} %** vom Hausverbrauch · Haus ohne WP: **{{ (h - w) | round(0)
        }} kWh** · Solar selbst genutzt: **{{ (p - e) | round(0) }} kWh** ({{ ((p - e) / p * 100) | round(0) if p > 0 else 0 }} %)


        *Verbrauch − Solar* ist die rechnerische Differenz. Der *gemessene Netzbezug* liegt meist höher, weil eingespeister Strom und Batterieverluste
        nicht im Haus ankommen.'
  - type: grid
    column_span: 2
    cards:
    - type: custom:energiebilanz-card
      mode: monate
      title: Pro Monat (12 Monate)
  - type: grid
    column_span: 2
    cards:
    - type: custom:energiebilanz-card
      mode: tage
      title: Pro Tag (30 Tage)
  - type: grid
    cards:
    - type: heading
      heading: Pro Tag (30 Tage)
      icon: mdi:calendar-today
    - type: statistics-graph
      title: Verbrauch und Solar pro Tag
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: sensor.total_consumed_energy
        name: Haus gesamt
        color: '#8d6e63'
      - entity: sensor.total_pv_generation
        name: Solar-Ertrag
        color: '#fdd835'
      grid_options:
        columns: full
        rows: 5
    - type: statistics-graph
      title: Netzbezug und Wärmepumpe pro Tag
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: sensor.total_imported_energy
        name: Netzbezug
        color: '#e53935'
      - entity: sensor.wp_energiemeter_energie
        name: Wärmepumpe
        color: '#fb8c00'
      grid_options:
        columns: full
        rows: 5
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Pro Monat (12 Monate)
      icon: mdi:calendar-range
    - type: statistics-graph
      title: Haus gesamt, Netzbezug und Wärmepumpe pro Monat
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      entities:
      - entity: sensor.total_consumed_energy
        name: Haus gesamt
        color: '#8d6e63'
      - entity: sensor.total_imported_energy
        name: Netzbezug
        color: '#e53935'
      - entity: sensor.wp_energiemeter_energie
        name: Wärmepumpe
        color: '#fb8c00'
      grid_options:
        columns: full
        rows: 6
    - type: statistics-graph
      title: Solar-Ertrag und Einspeisung pro Monat
      chart_type: bar
      period: month
      days_to_show: 365
      stat_types:
      - change
      entities:
      - entity: sensor.total_pv_generation
        name: Solar-Ertrag
        color: '#fdd835'
      - entity: sensor.total_exported_energy
        name: Einspeisung
        color: '#43a047'
      grid_options:
        columns: full
        rows: 5
