      entity: sensor.wp_kwh_pro_heizgradtag
      grid_options:
        columns: 6
      icon: mdi:chart-bell-curve
      name: kWh pro Heizgradtag (gestern)
      type: tile
    - color: blue
      entity: input_number.wp_heizgradtage_vortag
      grid_options:
        columns: 6
      icon: mdi:thermometer-minus
      name: Heizgradtage gestern
      tap_action:
        action: more-info
      type: tile
    - content: '**Heizgradtage** = 20 °C − Tagesmittel außen (0, wenn das Mittel ≥ 15 °C ist). **kWh pro Heizgradtag** rechnet das Wetter heraus:
        So lassen sich Tage und Einstellungen fair vergleichen. Basis Oktober 2026: **≈ 2,1–2,5**, Wochenschnitt ≈ 2,3. Schwankungen von ±0,15
        sind normal (Sonne, Wind, Lüften). Eine Änderung lohnt sich, wenn der Wert über eine Woche spürbar darunter bleibt. Berechnet täglich
        um 23:59, Tage unter 2 Heizgradtagen werden übersprungen.'
      grid_options:
        columns: full
      type: markdown
    - type: markdown
      content: '| Tagesmittel außen | Erwarteter Verbrauch |

        |---|---|

        | 10–12 °C | 15–25 kWh |

        | 5 °C | 30–40 kWh |

        | 0 °C | 50–60 kWh |

        | −5 °C | 75–90 kWh |


        **So liest du es:** Liegt der gemessene Balken deutlich (mehr als ~25 %) über dem erwarteten, lohnt ein Blick: Heizkurve zu hoch, Heizstab
        gelaufen, viel Abtauung oder Fenster offen. Die Erwartung ist eine Schätzung aus Heizlast (9,5 kW bei −7,7 °C) und typischer Effizienz
        bei 55/45 °C; nach ein paar Wochen Messwerten kann sie nachjustiert werden. Erster Tag nach dem Aufheizen und Tage mit Nachtabsenkung-Umstellung
        liegen höher.'
      grid_options:
        columns: full
  - type: grid
