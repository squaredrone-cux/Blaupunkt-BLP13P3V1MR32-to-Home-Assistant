# Dashboard „Wärmepumpe“ – im Dashboard: ⋮ > Bearbeiten > ⋮ > Raw-Konfigurationseditor, Inhalt ersetzen.
# Benötigt die Ressourcen /local/puffer-speicher-card.js und /local/energiebilanz-card.js (JavaScript-Modul)
# und aus HACS die Karte ring-tile (custom:ring-tile), siehe README.
title: Wärmepumpe NEU
views:
- title: Übersicht
  path: uebersicht
  icon: mdi:heat-pump
  type: sections
  max_columns: 3
  theme: Liquid Glass
  badges:
  - type: entity
    entity: binary_sensor.wp_storung
    show_name: true
    name: Störung
    color: red
    visibility:
    - condition: state
      entity: binary_sensor.wp_storung
      state: 'on'
  - type: entity
    entity: binary_sensor.wp_verdichter_lauft
    show_name: true
    name: Verdichter
    color: orange
  - type: entity
    entity: sensor.wp_wirkleistung
    show_name: true
    name: Leistung
    color: amber
  - type: entity
    entity: sensor.wp_aussentemperatur_gefiltert
    show_name: true
    name: Außen
    color: blue
  - type: entity
    entity: select.wp_modus
    show_name: true
    name: Modus
    color: green
  - type: entity
    entity: binary_sensor.wp_abtauung_aktiv
    show_name: true
    name: Abtauung
    color: cyan
    visibility:
    - condition: state
      entity: binary_sensor.wp_abtauung_aktiv
      state: 'on'
  - type: entity
    entity: binary_sensor.wp_heizstab_puffer
    show_name: true
    name: Heizstab
    color: red
    visibility:
    - condition: state
      entity: binary_sensor.wp_heizstab_puffer
      state: 'on'
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '## ⚠️ Störung der Wärmepumpe

        Mindestens ein Fehlerbit ist gesetzt. Details unter dem Reiter **Diagnose**.'
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: binary_sensor.wp_storung
        state: 'on'
    - type: heading
      heading: Status
      icon: mdi:information-outline
    - type: tile
      entity: switch.wp_power
      name: Power
      icon: mdi:power
      color: green
      tap_action:
        action: more-info
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.wp_verdichter_lauft
      name: Verdichter
      color: orange
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.wp_abtauung_aktiv
      name: Abtauung
      icon: mdi:snowflake-melt
      color: blue
      grid_options:
        columns: 4
    - type: tile
      entity: select.wp_modus
      name: Modus
      icon: mdi:leaf
      color: green
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: tile
      entity: input_select.wp_heizkurve_stufe
      name: Heizkurve
      icon: mdi:thermometer-lines
      color: deep-orange
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: heading
      heading: Laufzeit heute
      heading_style: subtitle
      icon: mdi:timer-outline
    - type: tile
      entity: sensor.wp_verdichter_laufzeit_heute
      name: Laufzeit
      icon: mdi:timer-sand
      color: orange
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.wp_verdichter_starts_heute
      name: Starts
      icon: mdi:restart
      color: orange
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.wp_mittlere_laufzeit_heute
      name: Ø Laufzeit/Start
      icon: mdi:timer-outline
      color: orange
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.wp_abtauungen_heute
      name: Abtauungen
      icon: mdi:snowflake-melt
      color: cyan
      grid_options:
        columns: 6
    - type: heading
      heading: Strom
      icon: mdi:flash
    - type: custom:ring-tile
      entity: sensor.wp_wirkleistung
      name: Leistung
      icon: mdi:flash
      ring_type: closed
      ring_size: 2
      indicator: arc
      min: 0
      max: 4
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        30%: ha_green
        60%: ha_yellow
        85%: ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.wp_energie_tag
      name: Heute (Ring = erwartet)
      icon: mdi:counter
      ring_type: closed
      ring_size: 2
      indicator: arc
      min: 0
      max: sensor.wp_erwarteter_tagesverbrauch
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        70%: ha_green
        100%: ha_yellow
        125%: ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.wp_wirkleistung
      name: Leistung 24 h
      icon: mdi:chart-line
      color: amber
      grid_options:
        columns: 6
        rows: 2
      features:
      - type: trend-graph
        hours_to_show: 24
    - type: tile
      entity: sensor.wp_energie_monat
      name: Monat
      icon: mdi:calendar-month
      color: amber
      grid_options:
        columns: 6
        rows: 2
  - type: grid
    cards:
    - type: heading
      heading: Temperaturen
      icon: mdi:thermometer
    - type: custom:ring-tile
      entity: sensor.wp_heizkurve_soll
      name: Soll (Heizkurve)
      icon: mdi:target
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.wp_aussentemperatur_gefiltert
      name: Außen
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: -15
      max: 25
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '0': ha_blue
        '10': ha_green
        '18': ha_yellow
        '25': ha_orange
        '-10': ha_purple
      marker: sensor.wp_aussentemperatur_mittel_24h
      marker_colour: ha_grey
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.wp_vorlauf_temperatur
      name: WP Vorlauf
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.wp_rucklauf_temperatur
      name: WP Rücklauf
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      marker: sensor.wp_heizkurve_soll
      marker_colour: ha_grey
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.wp_warmwasser_temperatur
      name: Pufferspeicher
      icon: mdi:water-boiler
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.puffer_heizkreis_vorlauf
      name: Heizkörper Vorlauf
      icon: mdi:radiator
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.puffer_heizkreis_rucklauf
      name: Heizkörper Rücklauf
      icon: mdi:radiator-disabled
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.wp_spreizung
      name: Spreizung WP
      icon: mdi:arrow-expand-vertical
      color: purple
      grid_options:
        columns: 6
        rows: 2
      features:
      - type: trend-graph
        hours_to_show: 24
- title: Steuerung
  path: steuerung
  icon: mdi:tune
  type: sections
  max_columns: 3
  theme: Liquid Glass
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Betrieb
      icon: mdi:power
    - type: tile
      entity: switch.wp_power
      name: Power
      icon: mdi:power
      color: green
      tap_action:
        action: toggle
      grid_options:
        columns: 4
    - type: tile
      entity: select.wp_betriebsmodus
      name: Betriebsmodus
      icon: mdi:cog-transfer
      color: deep-orange
      tap_action:
        action: none
      hold_action:
        action: none
      icon_tap_action:
        action: none
      grid_options:
        columns: 6
    - type: tile
      entity: select.wp_modus
      name: Modus
      icon: mdi:leaf
      color: green
      features:
      - type: select-options
      grid_options:
        columns: 6
        rows: 2
    - type: heading
      heading: Modus-Automatik
      heading_style: subtitle
      icon: mdi:auto-mode
    - type: tile
      entity: input_boolean.wp_modus_automatik
      name: Automatik ECO / Smart
      icon: mdi:auto-mode
      color: green
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: input_number.wp_smart_unter
      name: Smart unter (30 min)
      icon: mdi:thermometer-chevron-down
      color: blue
      features:
      - type: numeric-input
        style: buttons
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: input_number.wp_eco_ueber
      name: ECO über (60 min)
      icon: mdi:thermometer-chevron-up
      color: green
      features:
      - type: numeric-input
        style: buttons
      grid_options:
        columns: 6
        rows: 2
    - type: entities
      show_header_toggle: false
      entities:
      - entity: automation.wp_modus_automatisch_eco_smart_nach_aussentemperatur
        name: Zuletzt automatisch geschaltet
        type: attribute
        attribute: last_triggered
        format: relative
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Heizkurve
      heading_style: subtitle
      icon: mdi:chart-bell-curve-cumulative
      badges:
      - type: button
        icon: mdi:help-circle-outline
        tap_action:
          action: navigate
          navigation_path: /wp-neu/richtwerte-heizkurve
    - type: tile
      entity: switch.wp_p22_heiz_sollwert_automatik
      name: Heizkurve (automatischer Sollwert)
      icon: mdi:chart-bell-curve-cumulative
      color: deep-orange
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: input_select.wp_heizkurve_stufe
      name: Heizkurve
      icon: mdi:thermometer-lines
      color: deep-orange
      features:
      - type: select-options
      grid_options:
        columns: full
        rows: 2
      visibility:
      - condition: state
        entity: switch.wp_p22_heiz_sollwert_automatik
        state: 'on'
    - type: tile
      entity: number.wp_solltemperatur_heizen
      name: Soll Heizen
      icon: mdi:radiator
      color: deep-orange
      features:
      - type: numeric-input
        style: buttons
      grid_options:
        columns: full
        rows: 2
      visibility:
      - condition: state
        entity: switch.wp_p22_heiz_sollwert_automatik
        state: 'off'
    - type: heading
      heading: Heizkurve automatisch nachführen
      heading_style: subtitle
      icon: mdi:home-thermometer
    - type: tile
      entity: input_boolean.heizkurve_automatisch_anpassen
      name: Automatisch anpassen (täglich 21:00)
      color: green
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: input_number.wunsch_raumtemperatur
      name: Wunsch-Raumtemperatur
      color: deep-orange
      features:
      - type: numeric-input
        style: buttons
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: sensor.raumtemperatur_referenz
      name: Raumtemperatur (Referenz)
      color: orange
      grid_options:
        columns: 6
        rows: 2
      features:
      - type: trend-graph
        hours_to_show: 48
  - type: grid
    cards:
    - type: heading
      heading: Nachtabsenkung
      heading_style: subtitle
      icon: mdi:weather-night
    - type: tile
      entity: input_boolean.wp_nachtabsenkung
      name: Nachtabsenkung
      icon: mdi:weather-night
      color: indigo
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: input_select.wp_nachtabsenkung_stufe
      name: Stufe nachts
      icon: mdi:weather-night
      color: indigo
      features:
      - type: select-options
      grid_options:
        columns: full
        rows: 2
    - type: entities
      show_header_toggle: false
      entities:
      - entity: input_datetime.wp_nachtabsenkung_beginn
        name: Beginn
      - entity: input_datetime.wp_nachtabsenkung_ende
        name: Ende
      - entity: input_text.wp_heizkurve_tagesstufe_gemerkt
        name: Gemerkte Tagesstufe (leer = keine Absenkung aktiv)
        icon: mdi:content-save
      - entity: automation.wp_nachtabsenkung
        name: Zuletzt geschaltet
        type: attribute
        attribute: last_triggered
        format: relative
      grid_options:
        columns: full
    - type: heading
      heading: Zeitplan
      heading_style: subtitle
      icon: mdi:calendar-clock
    - type: tile
      entity: input_boolean.wp_zeitplan_aktiv
      name: Zeitplan aktiv
      icon: mdi:calendar-check
      color: green
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: schedule.wp_heizzeiten
      name: Heizzeiten (antippen zum Bearbeiten)
      icon: mdi:calendar-clock
      color: deep-orange
      state_content:
      - state
      - next_event
      tap_action:
        action: more-info
      grid_options:
        columns: full
    - type: heading
      heading: DC-Pumpe
      heading_style: subtitle
      icon: mdi:pump
    - color: blue
      entity: select.wp_dc_pumpe_modus
      features:
      - type: select-options
      grid_options:
        columns: full
        rows: 2
      icon: mdi:pump
      name: Modus
      type: tile
    - color: purple
      entity: number.wp_dc_pumpe_ziel_spreizung
      features:
      - style: buttons
        type: numeric-input
      grid_options:
        columns: 6
        rows: 2
      name: Ziel-Spreizung (Automatik)
      type: tile
      visibility:
      - condition: state
        entity: select.wp_dc_pumpe_modus
        state: Automatik
    - color: blue
      entity: number.wp_dc_pumpe_handdrehzahl
      features:
      - style: buttons
        type: numeric-input
      grid_options:
        columns: 6
        rows: 2
      name: Drehzahl (Manuell)
      type: tile
      visibility:
      - condition: state
        entity: select.wp_dc_pumpe_modus
        state: Manuell
    - content: 'Empfohlen: **Automatik, Ziel-Spreizung 5 K** – die Pumpe regelt dann im Betrieb auf ihre Mindestdrehzahl (40 %). Jede Änderung
        wird in den Speicher der Wärmepumpe geschrieben: nur gezielt verstellen. Die Anzeige aktualisiert sich bis zu 5 min verzögert.'
      grid_options:
        columns: full
      type: markdown
- title: Puffer
  path: puffer
  icon: mdi:water-boiler
  type: sections
  max_columns: 3
  theme: Liquid Glass
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Pufferspeicher
      icon: mdi:water-boiler
    - type: custom:ring-tile
      entity: sensor.puffer_wp_vorlauf
      name: WP Vorlauf
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.puffer_wp_rucklauf
      name: WP Rücklauf
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.puffer_heizkreis_vorlauf
      name: Heizkreis Vorlauf
      icon: mdi:radiator
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:ring-tile
      entity: sensor.puffer_heizkreis_rucklauf
      name: Heizkreis Rücklauf
      icon: mdi:radiator-disabled
      ring_type: open
      ring_size: 2
      indicator: dot
      scale: ticks
      min: 20
      max: 55
      middle_element: value_with_unit
      hide_state: true
      colourise_icon: true
      colour:
        '25': ha_blue
        '35': ha_yellow
        '45': ha_orange
        '55': ha_red
      grid_options:
        columns: 6
        rows: 2
    - type: custom:puffer-speicher-card
      title: Live-Ansicht
      entities:
        oben: sensor.puffer_heizkreis_vorlauf
        mitte: sensor.wp_warmwasser_temperatur
        unten: sensor.puffer_wp_rucklauf
        wp_vorlauf: sensor.puffer_wp_vorlauf
        wp_ruecklauf: sensor.puffer_wp_rucklauf
        hk_vorlauf: sensor.puffer_heizkreis_vorlauf
        hk_ruecklauf: sensor.puffer_heizkreis_rucklauf
        wp_pumpe: binary_sensor.wp_umwalzpumpe_lauft
        hk_pumpe: binary_sensor.heizkreispumpe_lauft
        verdichter: binary_sensor.wp_verdichter_lauft
      grid_options:
        columns: full
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Spreizung
      icon: mdi:arrow-expand-vertical
    - type: tile
      entity: sensor.wp_spreizung
      name: Wärmepumpe
      icon: mdi:heat-pump
      color: orange
      grid_options:
        columns: 6
        rows: 2
      features:
      - type: trend-graph
        hours_to_show: 24
    - type: tile
      entity: sensor.heizkreis_spreizung
      name: Heizkreis
      icon: mdi:radiator
      color: blue
      grid_options:
        columns: 6
        rows: 2
      features:
      - type: trend-graph
        hours_to_show: 24
    - type: heading
      heading: Heizkreispumpe
      icon: mdi:pump
    - type: tile
      entity: switch.umwalzpumpe_heizkreis
      name: Heizkreispumpe
      icon: mdi:pump
      color: blue
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: input_boolean.heizkreispumpe_automatik
      name: Automatik (folgt WP AN/AUS)
      icon: mdi:auto-mode
      color: green
      features:
      - type: toggle
      features_position: inline
      grid_options:
        columns: full
    - type: tile
      entity: binary_sensor.heizkreispumpe_lauft
      name: Läuft
      icon: mdi:pump
      color: blue
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.umwalzpumpe_heizkreis_leistung
      name: Leistung
      color: amber
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.umwalzpumpe_heizkreis_stromstarke
      name: Strom
      color: amber
      grid_options:
        columns: 4
    - type: heading
      heading: Puffer-Verlust
      icon: mdi:water-boiler-alert
    - type: tile
      entity: sensor.puffer_stillstandsverlust
      name: Wärmeverlust jetzt
      icon: mdi:water-boiler-alert
      color: orange
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.puffer_verlust_heute
      name: Verlust heute
      icon: mdi:counter
      color: orange
      grid_options:
        columns: 6
    - type: markdown
      content: Geschätzt aus Typenschild (53 W bei 45 K) und Puffertemperatur, Heizungsraum mit 18 °C angenommen. Strom dafür ≈ Wärmeverlust ÷
        3,5.
      grid_options:
        columns: full
    - heading: DC-Pumpe der Wärmepumpe
      icon: mdi:pump
      type: heading
    - color: blue
      entity: sensor.wp_dc_pumpe_drehzahl
      grid_options:
        columns: 6
        rows: 2
      icon: mdi:speedometer
      name: Drehzahl jetzt
      type: tile
      features:
      - type: trend-graph
        hours_to_show: 24
  - cards:
    - heading: Leitung Außengerät ↔ Puffer
      icon: mdi:pipe-leak
      type: heading
    - color: red
      entity: sensor.wp_leitung_verlust_vorlauf
      grid_options:
        columns: 4
        rows: 2
      name: Abkühlung Vorlauf (WP → Puffer)
      type: tile
      features:
      - type: trend-graph
