        columns: 6
    - type: tile
      entity: sensor.wp_prognose_14_tage
      name: Nächste 14 Tage
      color: amber
      grid_options:
        columns: 6
    - type: markdown
      grid_options:
        columns: full
      content: '{% from ''wp_prognose.jinja'' import wp_kwh_tag %}{% set d = state_attr(''sensor.wetterprognose_14_tage'',''daily'') %}{% set
        f = states(''sensor.wp_kwh_pro_heizgradtag_mittel_14_tage'') %}{% set tage = [''Mo'',''Di'',''Mi'',''Do'',''Fr'',''Sa'',''So''] %}{% if
        d %}| Tag | Außen Ø (min) | Strom WP | |

        |---|---|---|---|

        {% for i in range(d.time | count) %}{% set k = wp_kwh_tag(d.temperature_2m_mean[i], f) | float %}{% set dt = as_datetime(d.time[i]) %}|
        {{ tage[dt.weekday()] }} {{ dt.strftime(''%d.%m.'') }} | {{ d.temperature_2m_mean[i] }} °C ({{ d.temperature_2m_min[i] }}) | **{{ k }}
        kWh** | {{ ''█'' * ((k / 4) | round(0) | int) }} |

        {% endfor %}

        Modell aus deinen Messwerten: **kWh/Tag ≈ 2,6 × (18,7 − Tagesmittel)**, angepasst an die aktuelle Effizienz ({{ f }} kWh pro Heizgradtag,
        14-Tage-Mittel). Wetter: Open-Meteo, alle 3 h aktualisiert. Ab Tag 8 wird die Wetterprognose deutlich unsicherer.{% else %}Wetterprognose
        noch nicht verfügbar.{% endif %}'
