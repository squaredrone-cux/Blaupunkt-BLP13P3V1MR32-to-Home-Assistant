      title: Fehlercodes lesen
      content: 'Die Fehlerregister sind Bitfelder. Beispiel **Fehler 1**: Bit0 = Er 14 (Warmwasser-Fühler), Bit1 = Er 21 (Außenfühler), Bit2 =
        Er 16 (Spulenfühler), Bit4 = Er 27 (Vorlauffühler), Bit5 = Er 05 (Hochdruck), Bit6 = Er 06 (Niederdruck). Wert 33 = Bit0 + Bit5 = Er 14
        und Er 05. Die vollständige Zuordnung steht in der Protokollbeschreibung (Register 0x8007 bis 0x800D).'
      grid_options:
        columns: full
- title: Richtwerte Takten
  path: richtwerte-takten
  icon: mdi:help-circle-outline
  subview: true
  back_path: /wp-neu/verdichter
  type: sections
  max_columns: 3
  theme: Liquid Glass
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      title: Richtwerte Takten
      content: '| Kennzahl | ✅ gut | ⚠️ taktet zu viel |

        |---|---|---|

        | Mittlere Laufzeit pro Start | über 20–30 min | unter 10 min |

        | Verdichter-Starts pro Tag (Übergangszeit) | unter 10–15 | über 25 |

        | Starts pro Stunde | höchstens 3 | mehr als 3 |


        **Woran es liegen kann, wenn sie zu oft taktet:**

        - Vorlauf-Sollwert zu hoch für den aktuellen Bedarf → Heizkurve eine Stufe sparsamer

        - Heizkörperventile drosseln → Wärme bleibt im Puffer

        - Neustart-Differenz P01 zu klein (aktuell 4 K) → auf 5–6 K erhöhen'
      grid_options:
        columns: full
- title: Richtwerte Abtauung
  path: richtwerte-abtauung
  icon: mdi:help-circle-outline
  subview: true
  back_path: /wp-neu/abtauung
  type: sections
  max_columns: 3
  theme: Liquid Glass
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      title: Richtwerte Abtauung
      content: '| Kennzahl | ✅ gut | ⚠️ auffällig |

        |---|---|---|

        | Abtauungen | nur bei Kälte (unter ca. +5 °C) | schon bei milden Temperaturen |

        | Abstand zwischen Abtauungen | 45 min oder mehr | häufiger als alle 45 min |

        | Dauer einer Abtauung | 3–8 min | regelmäßig 10 min (Maximum P12) |


        **Woran es liegen kann:**

        - Kondensatablauf friert zu → Eis wächst von unten in den Verdampfer

        - Luftzufuhr am Außengerät behindert (Laub, Hecke, Schnee)

        - Tropfwasser von Dach oder Regenrinne auf dem Gerät

        - Abtau-Parameter P10–P13 erst ändern, wenn die Messwerte über mehrere kalte Tage auffällig sind'
      grid_options:
        columns: full
- title: Richtwerte Heizkurve
  path: richtwerte-heizkurve
  icon: mdi:help-circle-outline
  subview: true
  back_path: /wp-neu/steuerung
  type: sections
  max_columns: 3
  theme: Liquid Glass
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Richtwerte Heizkurve
      icon: mdi:chart-bell-curve-cumulative
    - type: markdown
      content: '**Jetzt:** Außen {{ states("sensor.wp_aussentemperatur_gefiltert") }} °C · Stufe **{{ states("input_select.wp_heizkurve_stufe")
        }}** · Soll **{{ states("sensor.wp_heizkurve_soll") }} °C**'
      grid_options:
        columns: full
    - type: markdown
      content: '| Außen | Sehr sparsam | Sparsam | **Normal** | Wärmer | Viel wärmer |

        |---|---|---|---|---|---|

        | 15 °C | 26 | 28 | **30** | 32 | 34 |

        | 14 °C | 27 | 29 | **31** | 33 | 35 |

        | 13 °C | 28 | 30 | **32** | 34 | 36 |

        | 12 °C | 29 | 31 | **33** | 35 | 37 |

        | 11 °C | 30 | 32 | **34** | 36 | 38 |

        | 10 °C | 31 | 33 | **35** | 37 | 39 |

        | 9 °C | 32 | 34 | **36** | 38 | 40 |

        | 8 °C | 33 | 35 | **37** | 39 | 41 |

        | 7 °C | 34 | 36 | **38** | 40 | 42 |

        | 6 °C | 35 | 37 | **39** | 41 | 43 |

        | 5 °C | 36 | 38 | **40** | 42 | 44 |

        | 4 °C | 37 | 39 | **41** | 43 | 45 |

        | 3 °C | 38 | 40 | **42** | 44 | 46 |

        | 2 °C | 39 | 41 | **43** | 45 | 47 |

        | 1 °C | 40 | 42 | **44** | 46 | 48 |

        | 0 °C | 41 | 43 | **45** | 47 | 49 |

        | −1 °C | 42 | 44 | **46** | 48 | 50 |

        | −2 °C | 43 | 45 | **47** | 49 | 51 |

        | −3 °C | 44 | 46 | **48** | 50 | 52 |

        | −4 °C | 45 | 47 | **49** | 51 | 53 |

        | −5 °C | 46 | 48 | **50** | 52 | 54 |

        | −6 °C | 47 | 49 | **51** | 53 | 55 |

        | −7 °C | 48 | 50 | **52** | 54 | 56 |

        | −8 °C | 49 | 51 | **53** | 55 | 57 |

        | −9 °C | 50 | 52 | **54** | 56 | 58 |

        | −10 °C | 51 | 53 | **55** | 57 | 59 |

        | −11 °C | 52 | 54 | **56** | 58 | 60 |

        | −12 °C | 53 | 55 | **57** | 59 | 61 |


        Werte in °C Wassertemperatur-Soll. Formel: **Soll = 20 + (P24 ÷ 10) × (P23 − Außen)**, mit P24 = 10. Die Stufe verschiebt P23: Sehr sparsam
        21 · Sparsam 23 · Normal 25 · Wärmer 27 · Viel wärmer 29.'
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Tipps
      icon: mdi:lightbulb-on-outline
    - type: markdown
      content: '**Einordnung für dein Haus:**

        - Die Heizkörper sind auf **55/45 °C** abgeglichen. Das entspricht „Normal“ bei etwa −10 °C (Auslegungstemperatur an der Küste).

        - Bei mildem Wetter reichen deutlich niedrigere Werte; je niedriger, desto effizienter: **1 °C weniger ≈ 2–3 % weniger Strom**.

        - Über 55 °C bringt bei deinen Heizkörpern kaum mehr Wärme, kostet aber viel Effizienz.


        **So stellst du richtig ein:**

        - Räume bei mildem Wetter zu kalt, bei Frost passend → Stufe **wärmer**

        - Räume überall zu warm → Stufe **sparsamer**

        - Immer nur **eine Stufe** ändern und **24 Stunden** abwarten – das Haus reagiert träge.

        - Nach dem ersten Aufheizen (Haus ausgekühlt) wieder auf **Normal** zurück.'
      grid_options:
        columns: full
