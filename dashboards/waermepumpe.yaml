      name: Korrektur Puffer-Rücklauffühler
      type: tile
    - content: 'Gemessen nur, während der Verdichter stabil läuft. **Positiv = Abkühlung auf der Leitung.** Ausgangslage Oktober bei ~10 °C außen:
        Vorlauf −0,2 K, Rücklauf ~0 K (nach Korrektur). Steigen die Werte bei Frost deutlich (> 0,5 K), lohnt bessere Dämmung der Außenleitungen.
        Der Puffer-Rücklauffühler zeigt ~2 K mehr als der Fühler im Außengerät; ob Fehlmessung oder nicht, klärt erst ein Wärmemengenzähler –
        deshalb gibt es den Rohwert und den korrigierten Wert.'
